name: 📈 Nifty 100 — 5-Strategy Scanner

on:
  schedule:
    - cron: "0 1 * * 1-5"   # Mon–Fri 6:30 AM IST (1:00 UTC)
  workflow_dispatch:          # manual trigger anytime from GitHub UI

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: flagged_history.json
          key: flagged-history-${{ runner.os }}
          restore-keys: flagged-history-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run 5-strategy scanner
        env:
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:      ${{ secrets.GMAIL_PASS }}
          TO_EMAIL:        ${{ secrets.TO_EMAIL }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
        run: python scanner.py

      - name: Save updated history
        uses: actions/cache@v4
        with:
          path: flagged_history.json
          key: flagged-history-${{ runner.os }}-${{ github.run_id }}
